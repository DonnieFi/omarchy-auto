# iOS edition CI (ADR-0017: one repo, two toolchains).
#
# Routing contract:
#   - Android checks: android.yml (Linux, every push/PR) — unchanged.
#   - Shared-input gate: this workflow's design-tokens job (Linux, every
#     push/PR). It verifies the committed design/omarchy-themes.json against
#     Theme.kt and proves regeneration is a byte-identical no-op, so a
#     change on either platform can never leave the tokens stale. It always
#     reports, keeping any required check from pending on single-platform
#     changes.
#   - Swift decode contract: the swift-tokens job below runs the
#     ios/DesignTokens SwiftPM package tests on GitHub's macos-26 runner
#     (Xcode 26, the spike's toolchain per docs/planning/IOS-ROADMAP.md).
#     No local Mac is required for the tokens surface.
#   - App shell: the app-shell job below generates the Xcode project from
#     ios/project.yml with XcodeGen (2.47.0), runs the hosted unit tests on
#     an iPhone simulator, and uploads portrait screenshots of the shell on
#     iPhone and iPad simulators. Signed distribution (installable archive,
#     TestFlight) joins when the owner's Apple Developer Program enrollment
#     lands (omarchy-h7w.4 / .13); unsigned CI builds are the ceiling until
#     then.
#   - Billing note: while this repository is public, arm64 macOS runners are
#     free, so the always-on macOS jobs are intended. If the repo goes
#     private, macOS minutes bill at ~10x the Linux rate — gate the macOS
#     jobs by changed paths at that point.

name: iOS & Shared

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  design-tokens:
    name: Shared design tokens
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Verify committed tokens match Theme.kt
        run: ./gradlew :core:testDebugUnitTest --no-daemon

      - name: Verify regeneration is deterministic (rewrite leaves no diff)
        run: |
          ./gradlew :core:testDebugUnitTest --no-daemon -Pomarchy.updateDesignTokens=true
          git diff --exit-code -- design/omarchy-themes.json

  swift-tokens:
    name: Swift tokens (macOS, Xcode 26)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Require the Xcode 26 toolchain
        run: |
          v=$(xcodebuild -version | head -1)
          echo "$v"
          case "$v" in
            Xcode\ 26*) ;;
            *) echo "::error::The macos-26 image's default toolchain is no longer Xcode 26 (found: $v). Pin or update the job." ; exit 1 ;;
          esac

      - name: Swift package tests (decode the committed design tokens)
        run: swift test --package-path ios/DesignTokens

  app-shell:
    name: App shell (macOS, Xcode 26)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Require the Xcode 26 toolchain
        run: |
          v=$(xcodebuild -version | head -1)
          echo "$v"
          case "$v" in
            Xcode\ 26*) ;;
            *) echo "::error::The macos-26 image's default toolchain is no longer Xcode 26 (found: $v). Pin or update the job." ; exit 1 ;;
          esac

      - name: Install XcodeGen 2.47.0
        run: |
          curl -fsSL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/2.47.0/xcodegen.zip"
          unzip -qo /tmp/xcodegen.zip -d /tmp/xcodegen-dist
          sudo mkdir -p /usr/local/bin
          sudo cp -R /tmp/xcodegen-dist/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          xcodegen --version

      - name: Generate the Xcode project
        run: |
          xcodegen generate --spec ios/project.yml
          xcodebuild -list -project ios/OmarchyAuto.xcodeproj

      - name: Surface generated-project facts (embeds, testability, edges)
        run: |
          pbx=ios/OmarchyAuto.xcodeproj/project.pbxproj
          {
            echo "PBX:: PlugIns copy phases (dstSubfolderSpec 13):"
            grep -B 2 -A 8 "dstSubfolderSpec = 13" "$pbx" | head -24
            echo "PBX:: target dependency edges:"
            grep -B 2 -A 2 "PBXTargetDependency" "$pbx" | head -16
            echo "PBX:: ENABLE_TESTABILITY / DEFINES_MODULE / TEST_HOST:"
            grep -E "ENABLE_TESTABILITY|DEFINES_MODULE|TEST_HOST =|BUNDLE_LOADER =" "$pbx" | head -12
          } | while IFS= read -r line; do
            echo "::notice::${line:0:440}"
          done

      - name: Pick available simulators
        id: sims
        run: |
          pick() {
            xcrun simctl list devices available -j | python3 -c "import json,sys; data=json.load(sys.stdin); print(next((d['udid'] for devices in data['devices'].values() for d in devices if d.get('isAvailable') and d['name'].startswith('$1')), ''))"
          }
          IPHONE=$(pick iPhone)
          IPAD=$(pick iPad)
          echo "iphone=$IPHONE" >> "$GITHUB_OUTPUT"
          echo "ipad=$IPAD" >> "$GITHUB_OUTPUT"
          echo "iPhone sim: $IPHONE"
          echo "iPad sim: $IPAD"
          test -n "$IPHONE"
          test -n "$IPAD"

      - name: Build and run the hosted tests (iPhone and iPad simulators)
        id: tests
        shell: bash
        run: |
          # GitHub runs this script with -eo pipefail; handle xcodebuild's
          # exit status manually so the failure branch always executes.
          set +e
          set -o pipefail
          test_on() {
            label="$1"; udid="$2"
            rm -rf "/tmp/test-$label.xcresult"
            rc=0
            xcodebuild -project ios/OmarchyAuto.xcodeproj \
              -scheme OmarchyAuto \
              -destination "platform=iOS Simulator,id=$udid" \
              -derivedDataPath ios/build \
              -resultBundlePath "/tmp/test-$label.xcresult" \
              test > "/tmp/build-$label.log" 2>&1 || rc=$?
            if [ "$rc" -ne 0 ]; then
              # Structured test summary straight from the result bundle.
              xcrun xcresulttool get test-results summary \
                --path "/tmp/test-$label.xcresult" > "/tmp/summary-$label.json" 2>>"/tmp/build-$label.log" || true
              {
                echo "## xcodebuild failure on $label (exit $rc)"
                echo '```'
                grep -E "error:|Testing failed|Failing tests|TEST EXECUTE FAILED|BUILD FAILED|Fatal error|Assertion|failed \(" -A 3 "/tmp/build-$label.log" | head -100
                echo '```'
                if [ -s "/tmp/summary-$label.json" ]; then
                  echo '### xcresult summary'
                  echo '```json'
                  head -c 4000 "/tmp/summary-$label.json"
                  echo '```'
                fi
              } >> "$GITHUB_STEP_SUMMARY"
              grep -E "error:|Testing failed:|Failing tests:|Fatal error|Assertion Failure|failed \(" "/tmp/build-$label.log" | head -12 | while IFS= read -r line; do
                echo "::error::[$label] ${line:0:460}"
              done
              # Context around the first module-resolution failure, which
              # never names its search paths in the one-line annotations.
              grep -B 4 -A 8 "compatible module" "/tmp/build-$label.log" | head -40 | while IFS= read -r line; do
                echo "::error::[$label][ctx] ${line:0:460}"
              done
              python3 -c "import json;d=json.load(open('/tmp/summary-$label.json'));[print('::error::[$label] FAILED TEST:',(t.get('testName') or '?'),':',(t.get('failureText') or '')[:280]) for t in d.get('testFailures',[])[:8]]" 2>/dev/null || true
              if ! grep -qE "error:|Testing failed|Failing tests|Fatal error|failed \(" "/tmp/build-$label.log"; then
                tail -n 20 "/tmp/build-$label.log" | while IFS= read -r line; do
                  echo "::error::[$label] ${line:0:400}"
                done
              fi
              exit "$rc"
            fi
          }
          test_on iphone "${{ steps.sims.outputs.iphone }}"
          test_on ipad "${{ steps.sims.outputs.ipad }}"

      - name: Retain raw test evidence (log, xcresult, project — even on failure)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-shell-test-evidence
          path: |
            /tmp/build-iphone.log
            /tmp/build-ipad.log
            /tmp/summary-iphone.json
            /tmp/summary-ipad.json
            /tmp/test-iphone.xcresult
            /tmp/test-ipad.xcresult
            ios/OmarchyAuto.xcodeproj/project.pbxproj
          if-no-files-found: ignore

      - name: Capture the shell on both simulators (idle and engaged Drive)
        run: |
          shot() {
            udid="$1"; prefix="$2"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" ios/build/Build/Products/Debug-iphonesimulator/OmarchyAuto.app
            xcrun simctl launch "$udid" com.omarchy.auto.ios
            sleep 6
            xcrun simctl io "$udid" screenshot "${prefix}-idle.png"
            xcrun simctl terminate "$udid" com.omarchy.auto.ios || true
            xcrun simctl launch "$udid" com.omarchy.auto.ios -engageStage drive
            sleep 4
            xcrun simctl io "$udid" screenshot "${prefix}-drive.png"
            xcrun simctl shutdown "$udid" || true
          }
          shot "${{ steps.sims.outputs.iphone }}" OmarchyAuto-iphone
          shot "${{ steps.sims.outputs.ipad }}" OmarchyAuto-ipad

      - uses: actions/upload-artifact@v7
        with:
          name: omarchy-auto-ios-shell
          path: |
            OmarchyAuto-iphone-idle.png
            OmarchyAuto-iphone-drive.png
            OmarchyAuto-ipad-idle.png
            OmarchyAuto-ipad-drive.png
          if-no-files-found: error
